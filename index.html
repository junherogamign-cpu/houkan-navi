<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f2f8f8">
  <title>訪問看護制度ナビ</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand-copy">
        <p class="eyebrow">現場での制度確認をサポートするツール</p>
        <h1>訪問看護制度ナビ</h1>
        <p class="tagline">訪問看護の制度・加算を、かんたんに確認</p>
      </div>
    </header>

    <main>
      <section class="form-section" aria-labelledby="form-heading">
        <div class="section-intro">
          <p class="step-label">制度確認</p>
          <h2 id="form-heading">利用者情報を見ながら質問できます</h2>
          <p>分かる範囲の情報で大丈夫です。</p>
        </div>

        <div class="form-grid">
          <section class="card user-info-card" aria-label="利用者情報">
            <div class="age-field">
              <label class="title" for="age">年齢</label>
              <div class="age-control">
                <input id="age" type="number" min="0" max="120" inputmode="numeric" placeholder="75">
                <span>歳</span>
              </div>
            </div>

            <fieldset class="insurance-field">
              <legend class="title">保険の種類</legend>
              <div class="choices">
                <label><input type="radio" name="insurance" value="介護保険"><span>介護保険</span></label>
                <label><input type="radio" name="insurance" value="医療保険"><span>医療保険</span></label>
                <label><input type="radio" name="insurance" value="わからない" checked><span>わからない</span></label>
              </div>
            </fieldset>
          </section>

          <div class="card field-card condition-card">
            <label class="title" for="condition">疾患・状態</label>
            <textarea id="condition" class="condition-input" rows="1" placeholder="例：パーキンソン病、脳梗塞後遺症 など"></textarea>
          </div>

          <div class="card field-card question-card">
            <label class="title" for="question">確認したいこと</label>
            <p class="field-hint">この利用者さんについて確認したい制度や疑問を入力してください</p>
            <textarea id="question" class="question-input" placeholder="例：この利用者さんは週3回訪問できますか？&#10;退院直後ですが算定できる加算はありますか？&#10;この疾患の場合、どの加算を確認すればいいですか？"></textarea>
          </div>
        </div>

        <section class="card check-card" aria-labelledby="check-heading">
          <div class="check-copy">
            <h3 id="check-heading">見落としチェック</h3>
            <p>制度だけでなく、算定前に確認しておきたいポイント</p>
          </div>
          <label class="switch-label" for="check">
            <span class="switch-text">確認する</span>
            <input id="check" type="checkbox" checked>
            <span class="switch-ui" aria-hidden="true"></span>
          </label>
        </section>

        <button class="submit-button" type="button" onclick="answer()">
          <span>制度を確認する</span><span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <section id="result" class="card result" aria-live="polite" aria-label="制度の確認結果"></section>

      <section id="resultPoints" class="card result-extra result-points" aria-labelledby="points-heading">
        <h2 id="points-heading">確認ポイント</h2>
        <div class="result-points-content"></div>
      </section>

      <section id="resultChecks" class="card result-extra result-checks" aria-labelledby="result-check-heading">
        <h2 id="result-check-heading">見落としチェック</h2>
        <p class="extra-intro">確認した項目にチェックを付けてください。</p>
        <div class="result-check-content"></div>
      </section>

      <section id="resultSources" class="card result-extra result-sources" aria-labelledby="source-heading">
        <h2 id="source-heading">根拠資料</h2>
        <div class="result-source-content"></div>
      </section>

      <div id="glossary" class="card" style="display:none">
        <h2>用語を確認する</h2>
        <div id="terms"></div>
      </div>
    </main>

    <footer>β版：実務確認用の試作です。制度判断は最新の厚生労働省資料・自治体等の運用も確認してください。</footer>
  </div>

  <script defer src="./js/glossary.js"></script>
  <script defer src="./js/rules.js"></script>
  <script defer src="./js/app.js"></script>
</body>
</html>
