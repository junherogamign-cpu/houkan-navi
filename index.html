<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>訪問看護制度ナビ</title>
<style>
:root{
  --bg:#f7f8fa;
  --card:#fff;
  --text:#20242a;
  --muted:#69717d;
  --line:#e4e7eb;
  --accent:#2563eb;
  --soft:#eef4ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",sans-serif;
}
.wrap{
  max-width:760px;
  margin:0 auto;
  padding:28px 18px 60px;
}
.head{
  margin-bottom:22px;
}
.head h1{
  font-size:25px;
  margin:0 0 8px;
}
.head p{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  margin:14px 0;
}
label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}
.field{
  margin-bottom:18px;
}
input,select,textarea{
  width:100%;
  border:1px solid #d6dae0;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  background:#fff;
}
textarea{
  min-height:120px;
  resize:vertical;
}
.hint{
  font-size:13px;
  color:var(--muted);
  margin-top:6px;
}
.check{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
}
.check input{
  width:20px;
  height:20px;
}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px 16px;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:wait;
}
.result{
  display:none;
}
.result h2{
  font-size:19px;
  margin:0 0 10px;
}
.answer{
  white-space:pre-wrap;
  line-height:1.8;
  font-size:15px;
}
.loading{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:20px;
}
.error{
  display:none;
  color:#b42318;
  background:#fff1f0;
  border:1px solid #ffd5d2;
  border-radius:10px;
  padding:14px;
  line-height:1.6;
}
footer{
  font-size:11px;
  color:var(--muted);
  margin-top:20px;
}
</style>
</head>

<body>
<div class="wrap">

  <div class="head">
    <h1>訪問看護制度ナビ</h1>
    <p>細かくてややこしい訪問看護制度を、必要な条件から一緒に整理します。</p>
  </div>

  <div class="card">

    <div class="field">
      <label for="age">① 年齢</label>
      <input id="age" type="number" min="0" max="120" placeholder="例：75">
    </div>

    <div class="field">
      <label for="insurance">② 保険の種類</label>
      <select id="insurance">
        <option value="">選択してください</option>
        <option value="医療保険">医療保険</option>
        <option value="介護保険">介護保険</option>
        <option value="わからない">わからない</option>
      </select>
    </div>

    <div class="field">
      <label for="condition">③ 疾患・状態</label>
      <input id="condition" type="text" placeholder="例：ALS、パーキンソン病、脳梗塞後遺症">
    </div>

    <div class="field">
      <label for="question">④ 知りたいこと</label>
      <textarea id="question" placeholder="例：介護保険から医療保険に切り替えた方がいい？"></textarea>
    </div>

    <div class="field">
      <label class="check">
        <input id="checkMissing" type="checkbox" checked>
        見落としチェックもする
      </label>
      <div class="hint">関連する制度や、追加で確認した方がよい条件も確認します。</div>
    </div>

    <button id="submitBtn" onclick="ask()">制度を確認する</button>

    <div id="loading" class="loading">
      制度を整理しています…
    </div>

    <div id="error" class="error"></div>

  </div>

  <div id="result" class="card result">
    <h2>回答</h2>
    <div id="answer" class="answer"></div>
  </div>

  <footer>
    ※本ツールは制度情報を整理するための補助ツールです。実際の算定については最新の厚生労働省通知・告示等をご確認ください。
  </footer>

</div>

<script>
const API_URL =
  "https://blue-grass-6d34.jun-herogamign.workers.dev/";

async function ask(){

  const age = document.getElementById("age").value;
  const insurance = document.getElementById("insurance").value;
  const condition = document.getElementById("condition").value.trim();
  const question = document.getElementById("question").value.trim();
  const checkMissing = document.getElementById("checkMissing").checked;

  const error = document.getElementById("error");
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const answer = document.getElementById("answer");
  const button = document.getElementById("submitBtn");

  error.style.display = "none";
  result.style.display = "none";

  if(!age || !insurance || !condition || !question){
    error.textContent = "年齢・保険の種類・疾患/状態・知りたいことを入力してください。";
    error.style.display = "block";
    return;
  }

  button.disabled = true;
  loading.style.display = "block";

  try{

    const response = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        age,
        insurance,
        condition,
        question,
        checkMissing
      })
    });

    const data = await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.error || "回答を取得できませんでした。");
    }

    answer.textContent = data.answer;
    result.style.display = "block";

    result.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  }catch(e){

    error.textContent =
      "AIとの接続でエラーが発生しました。\n" + e.message;

    error.style.display = "block";

  }finally{

    button.disabled = false;
    loading.style.display = "none";

  }
}
</script>

</body>
</html>
